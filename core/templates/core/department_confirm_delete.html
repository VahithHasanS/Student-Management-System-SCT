{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card glass-container border-0 shadow-lg mt-4">
            <div class="card-header bg-transparent border-0 pt-4 pb-0 text-center">
                <div class="bg-danger bg-opacity-25 rounded-circle p-3 d-inline-flex text-danger mb-3">
                    <i class="fas fa-exclamation-triangle fa-2x"></i>
                </div>
                <h4 class="fw-bold mb-0 text-danger">Confirm Deletion</h4>
            </div>
            <div class="card-body p-4 p-md-5 pt-3 text-center">
                <p class="fs-5 mb-4">Are you sure you want to delete department <strong>{{ department.name }}</strong>?</p>
                
                <div class="alert alert-danger bg-danger bg-opacity-10 border-0 glass-card text-start mb-4">
                    <i class="fas fa-exclamation-circle me-2"></i> <strong>Warning:</strong> This action cannot be undone.
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-3 justify-content-center mt-5">
                        <button type="submit" class="btn btn-danger flex-grow-1 rounded-pill fw-bold shadow-sm py-2"><i class="fas fa-trash me-2"></i> Yes, Delete</button>
                        <a href="{% url 'department_list' %}" class="btn btn-secondary flex-grow-1 rounded-pill fw-bold shadow-sm py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
