{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom Glass Theme -->
    <link rel="stylesheet" href="{% static 'css/glass.css' %}">
</head>

<body class="auth-bg d-flex align-items-center justify-content-center min-vh-100 m-0">
    <!-- Theme Toggle at top right -->
    <button id="theme-toggle" class="theme-toggle-btn position-absolute top-0 end-0 m-4 text-white" title="Toggle Theme" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card glass-container border-0 shadow-lg p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-white mb-2" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">Student Portal</h3>
                        <p class="text-white-50 mb-0">Sign in to your account</p>
                    </div>
                    
                    <div class="card-body p-0">
                        <form method="post">
                            {% csrf_token %}
                            {% if form.errors %}
                            <div class="alert alert-danger glass-card border-0 text-white bg-danger bg-opacity-75">Invalid username or password.</div>
                            {% endif %}
                            
                            <div class="mb-4 form-floating">
                                <input type="text" name="username" class="form-control glass-card text-white bg-transparent" id="usernameInput" placeholder="Username" required>
                                <label for="usernameInput" class="text-white-50">Username</label>
                            </div>
                            
                            <div class="mb-4 form-floating">
                                <input type="password" name="password" class="form-control glass-card text-white bg-transparent" id="passwordInput" placeholder="Password" required>
                                <label for="passwordInput" class="text-white-50">Password</label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow">Login</button>
                        </form>
                        
                        <hr class="my-4 border-light opacity-25">
                        
                        <p class="text-center mb-0">
                            <a href="{% url 'register' %}" class="text-white text-decoration-none hover-opacity-75">Don't have an account? <strong class="text-info">Register here</strong></a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    <style>
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: rgba(255,255,255,0.8);
            background: transparent;
        }
    </style>
</body>

</html>
