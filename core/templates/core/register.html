{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom Glass Theme -->
    <link rel="stylesheet" href="{% static 'css/glass.css' %}">
</head>

<body class="auth-bg d-flex align-items-center justify-content-center min-vh-100 m-0 py-5">
    <!-- Theme Toggle at top right -->
    <button id="theme-toggle" class="theme-toggle-btn position-absolute top-0 end-0 m-4 text-white" title="Toggle Theme" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card glass-container border-0 shadow-lg p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-white mb-2" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">Create Account</h3>
                        <p class="text-white-50 mb-0">Join the Student Management System</p>
                    </div>
                    
                    <div class="card-body p-0">
                        <form method="post">
                            {% csrf_token %}
                            {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label text-white-50 ms-1">{{ field.label }}</label>
                                {% if field.errors %}
                                    <div class="text-danger small mb-1 ms-1 fw-bold" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">{{ field.errors.0 }}</div>
                                {% endif %}
                                <div class="form-floating">
                                    {{ field }}
                                </div>
                            </div>
                            {% endfor %}
                            
                            <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-pill shadow mt-2" style="background: var(--accent-success); border:none;">Register</button>
                        </form>
                        
                        <hr class="my-4 border-light opacity-25">
                        
                        <p class="text-center mb-0">
                            <a href="{% url 'login' %}" class="text-white text-decoration-none hover-opacity-75">Already have an account? <strong class="text-info">Login here</strong></a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add required classes to Django form fields
            const inputs = document.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                input.classList.add('form-control', 'glass-card', 'text-white', 'bg-transparent');
                input.style.border = '1px solid rgba(255,255,255,0.2)';
            });
        });
    </script>
</body>

</html>
