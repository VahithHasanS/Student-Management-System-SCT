{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card glass-container border-0 shadow-lg mt-4">
            <div class="card-header bg-transparent border-0 pt-4 pb-0 text-center">
                <h4 class="fw-bold mb-0">Select Department</h4>
                <p class="text-muted small mt-1">Please choose a department to continue</p>
            </div>
            <div class="card-body p-4 p-md-5 pt-3">
                <form method="get">
                    <div class="mb-4">
                        <label class="form-label fw-medium ms-1">Choose Department</label>
                        <select name="dept_id" class="form-select shadow-none" style="transition: all 0.3s ease;" required>
                            <option value="">Select Department</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}">{{ dept.name }} ({{ dept.code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="d-flex mt-5">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold shadow-sm py-2">Continue <i class="fas fa-arrow-right ms-2"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
